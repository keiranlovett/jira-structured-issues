# Template for basic Quest. This does not include the additional tasks of a Main Quest
---
Prompt: "Please enter the name of the Quest only."
Mappings:
  Epic:
    fields:
      project:
        key: STN
      issuetype:
        name: Epic
      summary: "Character - {character_name}"
      customfield_10672: "Character - {character_name}"
      reporter:
        name: "john.aitchison@gameloft.com"
      components:
        - name: POD - Character Art
  Story:
    fields:
      project:
        key: STN
      issuetype:
        name: Story
      summary: ""
      reporter:
        name: "john.aitchison@gameloft.com"
      components:
        - name: POD - Character Art
      customfield_10671: "{parentKey}"
    update:
      issuelinks:
        - add:
            type:
              name: Parent-Child
              inward: is parent of
            inwardIssue:
              key: "{parentKey}"
  Task:
    fields:
      project:
        key: STN
      issuetype:
        name: Task
      summary: ""
      customfield_19581: "{parentKey}"
      reporter:
        name: "john.aitchison@gameloft.com"
      components:
        - name: POD - Character Art
    update:
      issuelinks:
        - add:
            type:
              name: Parent-Child
              inward: is parent of
            inwardIssue:
              key: "{issueRef[issueEpic]}"

Structure:
  - type: Epic
    refId: issueEpic
    summary: "Character - {character_name}"
    items:
      - type: Story
        refId: issue1
        summary: "[Q0] Character - {character_name}"
        customfield_19673:
          value: "Q0"
          issuelinks:
            - type:
                name: Relates
                inwardIssue: "{issueRef[issueEpic]}"
        items:
          - type: Task
            summary: "[Q0][Character - {character_name}] Reference Gathered"
          - type: Task
            summary: "[Q0][Character - {character_name}] Concept"
      - type: Story
        refId: issue2
        summary: "[Q1] Character - {character_name}"
        customfield_19673:
          value: "Q1"
        items:
          - type: Task
            summary: "[Q1][Character - {character_name}] Sculpt"
      - type: Story
        summary: "[Q2] Character - {character_name}"
        refId: issue3
        customfield_19673:
          value: "Q2"
        description: "The Quest's are reflective of their actual intended gameplay experience. All placeholders have been removed."
        items:
          - type: Task
            summary: "[Q2][Character - {character_name}] Model"
          - type: Task
            summary: "[Q2][Character - {character_name}] Rigging"
          - type: Task
            summary: "[Q1][Character - {character_name}] Textures"
          - type: Task
            summary: "[Q2][Character - {character_name}] In-Game Integration"
     