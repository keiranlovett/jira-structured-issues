---
Prompt: "Please enter the first name last name only. Other details will be provided. Example 'Lucas' will become 'Character - Lucas Sincalir':"
Mappings:
  Epic:
    fields:
      project:
        key: STN
      issuetype:
        name: Epic
      summary: "Character - {name}"
      description: ""
      customfield_10672: "Character - {name}"
      reporter:
        name: "john.aitchison@gameloft.com"
      components:
        - name: TEAM - Character + Animation
  Task:
    fields:
      project:
        key: STN
      issuetype:
        name: Task
      summary: ""
      description: ""
      customfield_19673:
          value: "L0"
      customfield_10671: "{parentKey}"
      reporter:
        name: "john.aitchison@gameloft.com"
      components:
        - name: TEAM - Character + Animation
    update:
      issuelinks:
        - add:
            type:
              name: Parent-Child
              inward: is parent of
              outward: is child of
            inwardIssue:
              key: "{parentKey}"
Structure:
  - type: Epic
    refId: issueEpic
    step: "prompt"
    summary: "Character - {name}"
    items:
      - type: Task
        refId: conceptTask
        summary: "[L0][{query['[0].summary']}] Concept Art"
        components:
              - name: TEAM - Concept
              - name: TEAM - Character + Animation
        customfield_19673:
          value: "L0"
        reporter:
          name: "duke.mighten@gameloft.com"
      - type: Task
        refId: sculptTask
        summary: "[L1][{query['[0].summary']}] HiRez Model Sculpt"
        description: "Definition of Done: "
        customfield_19673:
          value: "L1"
        issuelinks:
          type: Relates
          inwardIssue: "{issueRef[conceptTask]}"
      - type: Task
        refId: modelTask
        summary: "[L2][{query['[0].summary']}] Ingame Model"
        customfield_19673:
          value: "L1"
        issuelinks:
          type: Relates
          inwardIssue: "{issueRef[sculptTask]}"
      - type: Task
        summary: "[L1][{query['[0].summary']}] Texturing"
        customfield_19673:
          value: "L1"
        issuelinks:
          type: Relates
          inwardIssue: "{issueRef[modelTask]}"
      - type: Task
        refId: skinningTask
        summary: "[L2][{query['[0].summary']}] Skinning"
        customfield_19673:
          value: "L1"
        issuelinks:
          type: Relates
          inwardIssue: "{issueRef[modelTask]}"
      - type: Task
        summary: "[L2][{query['[0].summary']}] Animation"
        description: "Any character specific animations should be included as sub-tasks"
        customfield_19673:
          value: "L1"
        issuelinks:
          type: Relates
          inwardIssue: "{issueRef[skinningTask]}"

