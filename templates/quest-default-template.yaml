# Template for basic Quest. This does not include the additional tasks of a Main Quest
---
Prompt: "Please enter the name of the Quest only."
Mappings:
  Epic:
    fields:
      project:
        key: STN
      issuetype:
        name: Epic
      summary: ""
      customfield_10672: "{quest_type:Location, Side, Main} Quest - {shorthand_name}"
      reporter:
        name: "{reporter}"
      components:
        - name: POD - Narrative
  Story:
    fields:
      project:
        key: STN
      issuetype:
        name: Story
      summary: ""
      reporter:
        name: "{reporter}"
      components:
        - name: POD - Narrative
      customfield_10671: "{parentKey}"
    update:
      issuelinks:
        - add:
            type:
              name: Parent-Child
              inward: is parent of
            inwardIssue:
              key: "{parentKey}"
  Task:
    fields:
      project:
        key: STN
      issuetype:
        name: Task
      summary: ""
      customfield_19581: "{parentKey}"
      reporter:
        name: "{reporter}"
      components:
        - name: POD - Narrative
    update:
      issuelinks:
        - add:
            type:
              name: Parent-Child
              inward: is parent of
            inwardIssue:
              key: "{issueRef[issueEpic]}"
  TestPlan:
    fields:
      project:
        key: STN
      issuetype:
        name: Test Plan
      summary: ""
      reporter:
        name: "{reporter}"
      components:
        - name: POD - Narrative
Structure:
  - type: Epic
    refId: issueEpic
    step: "prompt"
    summary: "{quest_type:Location, Side, Main} Quest - {quest_name}"
    items:
      - type: Story
        refId: issue1
        summary: "[Q0]{query['[0].summary']}"
        customfield_19673:
          value: "Q0"
          issuelinks:
            - type:
                name: Relates
                inwardIssue: "{issueRef[issueEpic]}"
        items:
          - type: Task
            summary: "[Q0][{query['[0].summary']}] Narrative Spec"
          - type: Task
            refId: artTasks
            summary: "[Q0][{query['[0].summary']}] Asset List Creation"
            description: "A full list of required assets for the Quest is written, including any models, animations, textures, cutscenes, audio and locations will be needed. This also includes creating tasks for such assets, and assigning them to their appropriate leads."
            components:
              - name: POD - Narrative
              - name: POD - Environment Art
      - type: Story
        refId: issue2
        summary: "[Q1]{query['[0].summary']}"
        customfield_19673:
          value: "Q1"
        items:
          - type: Task
            summary: "[Q1][{query['[0].summary']}] Quest Blueprint (Whitebox)"
            description: "Initial implementation of the gameplay tasks in Unreal, allowing the Player to move between and complete Quest tasks in order (or at least a placeholder version so as not to block progression)."
          - type: Task
            summary: "[Q1][{query['[0].summary']}] Dialogue Scaffold (1st Pass)"
            description: "The Quest can be independently started, followed (with at least placeholder tasks), and completed by a Player outside the Editor, without the game breaking or requiring cheats."
      - type: Story
        summary: "[Q2]{query['[0].summary']}"
        refId: issue3
        customfield_19673:
          value: "Q2"
        description: "The Quest's are reflective of their actual intended gameplay experience. All placeholders have been removed."
        items:
          - type: Task
            summary: "[Q2][{query['[0].summary']}] Quest Blueprint"
          - type: Task
            summary: "[Q2][{query['[0].summary']}] Dialogue (2nd Pass)"
            description: "All dialogue options for the Player have been entered and work, and all contain Mood / Affinity / State changes as appropriate. Freeroam dialogue has been added as appropriate."
          - type: Task
            summary: "[Q1][{query['[0].summary']}] Quest Assets (NPC / Props)"
            components:
              - name: POD - Narrative
              - name: POD - Environment Art
            issuelinks:
              type: Relates
              inwardIssue: "{issueRef[artTasks]}"
          - type: Task
            summary: "[Q2][{query['[0].summary']}] Quest Assets (VFX)"
            components:
              - name: POD - Narrative
              - name: POD - Environment Art
            issuelinks:
              type: Relates
              inwardIssue: "{issueRef[artTasks]}"
          - type: Task
            summary: "[Q2][{query['[0].summary']}] Cut-Scene"
            components:
              - name: POD - Narrative
              - name: POD - Character Art
            issuelinks:
              type: Relates
              inwardIssue: "{issueRef[artTasks]}"
      - type: Story
        summary: "[Q3]{query['[0].summary']}"
        refId: issue4
        customfield_19673:
          value: "Q3"
        items:
          - type: Task
            summary: "[Q3][{query['[0].summary']}] Dialogue (Final Pass)"
            description: "All tasks are tweaked to the point they're not just playable, but also engaging gameplay. They are difficult enough, etc."
          - type: Task
            summary: "[Q3][{query['[0].summary']}] VO"
            components:
              - name: POD - Narrative
              - name: Audio
  - type: TestPlan
    summary: "[Test Plan] {query['[0].summary']}"
    issuelinks:
      type: Relates
      inwardIssue: "{issueRef[issueEpic]}"